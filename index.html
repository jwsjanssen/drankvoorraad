<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E5A6E'/%3E%3Cpath d='M27 10h10v10l7 10v22a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V30l7-10z' fill='%23fff'/%3E%3C/svg%3E">
<title>Drankvoorraad FLOATS &amp; ALTSTADT</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: één kolom (max 900px) voor gebruik op telefoon in de voorraadruimte; vaste kop met locatie + tabs, vaste voortgangsbalk onderaan tijdens het tellen. */
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#EAE5DD; --ink:#1F1A16; --muted:#675C53; --line:#DCD3C7; --control:#8A7C70;
  --floats:#0E5A6E; --altstadt:#A8161C; --on-accent:#FFFFFF;
  --good:#2A6540; --good-bg:#DDEEDF; --warn:#7A4A00; --warn-bg:#F8E7C4; --bad:#A1201A; --bad-bg:#F7DAD6;
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --font-text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
  --accent:var(--floats);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171310; --surface:#221C18; --surface-2:#2D2520; --ink:#F3ECE3; --muted:#BBAD9F; --line:#40342C; --control:#8F8072;
  --floats:#62B9CE; --altstadt:#EC7C74; --on-accent:#171310;
  --good:#86C596; --good-bg:#1E3325; --warn:#E6B15C; --warn-bg:#3A2D14; --bad:#F29088; --bad-bg:#40201D;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171310; --surface:#221C18; --surface-2:#2D2520; --ink:#F3ECE3; --muted:#BBAD9F; --line:#40342C; --control:#8F8072;
  --floats:#62B9CE; --altstadt:#EC7C74; --on-accent:#171310;
  --good:#86C596; --good-bg:#1E3325; --warn:#E6B15C; --warn-bg:#3A2D14; --bad:#F29088; --bad-bg:#40201D;
  color-scheme:dark;
}
body[data-loc="altstadt"]{--accent:var(--altstadt)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:22px} h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* kop */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:12px;height:22px;border-radius:2px 2px 5px 5px;background:var(--accent);flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:18px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:6px;font-weight:600;font-size:13.5px;min-height:38px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.soft button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--control);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.note{border-radius:var(--r);padding:10px 12px;font-size:14px;background:var(--surface-2)}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.good{background:var(--good-bg);color:var(--good)} .note.bad{background:var(--bad-bg);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px}
.input{border:1px solid var(--control);background:var(--surface);border-radius:var(--r);padding:9px 11px;font-size:16px;min-height:42px;width:100%}

/* tellen */
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .wk{flex:1;min-width:0}
.weekbar .wk b{font-family:var(--font-display);font-size:21px;display:block;line-height:1.1}
.iconbtn{width:42px;height:42px;border-radius:var(--r);border:1px solid var(--control);background:var(--surface);font-size:18px;flex:none}
.iconbtn:disabled{opacity:.35}
.toolbar{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;min-height:34px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{scroll-margin-top:130px}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 2px 6px}
.cat-head .cnt{font-size:12.5px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:12.5px;color:var(--muted)}
.row-note{font-size:12.5px;color:var(--muted)}
.row-note.warn{color:var(--warn);font-weight:600}
.row.done .row-name::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:7px;vertical-align:middle}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.st{width:40px;height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:20px;font-weight:600;line-height:1}
.qty{width:68px;height:44px;text-align:center;font-size:17px;font-weight:600;border:1px solid var(--control);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums}
.qty.invalid{border-color:var(--bad);background:var(--bad-bg)}
.qty:disabled,.st:disabled{opacity:.55}
.weigh{border:1px solid var(--control);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;min-height:32px;margin-top:6px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bottombar .in{display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
details.help summary{cursor:pointer;font-weight:600}
details.help ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}

/* overzicht */
.loccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.loccard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.loccard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.loccard .big{font-family:var(--font-display);font-size:24px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
.stat .d{font-size:12.5px;color:var(--muted)}
.weeks{display:flex;gap:5px;flex-wrap:wrap}
.wkbox{width:38px;border-radius:6px;padding:5px 0;text-align:center;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.wkbox b{display:block;font-size:14px}
.wkbox.done{background:var(--good-bg);color:var(--good)} .wkbox.open{background:var(--warn-bg);color:var(--warn)} .wkbox.miss{background:var(--bad-bg);color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font-text)}
.chart .lab{fill:var(--ink);font-size:11.5px;font-weight:600;font-family:var(--font-text)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)} .chart .b:hover{opacity:.8}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.share{display:block;height:5px;border-radius:3px;background:var(--accent);margin-top:4px;min-width:2px}
.sig{display:flex;flex-direction:column;gap:8px}
.sig-item{display:flex;gap:10px;align-items:flex-start}
.sig-item .pill{flex:none;margin-top:1px}
.empty{text-align:center;padding:34px 16px;color:var(--muted);max-width:52ch;margin:0 auto}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:18px}

/* producten */
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.prow:first-child{border-top:0}
.prow.off{opacity:.55}
.prow .chev{color:var(--muted);flex:none}

/* modal, toast, tooltip */
#modal{position:fixed;inset:0;z-index:40;background:rgba(15,10,8,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){#modal{align-items:center}}
.sheet:focus{outline:none}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
textarea.input{min-height:90px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
/* inlogscherm */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:max(48px,calc(env(safe-area-inset-top,0px) + 32px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-height:620px){.gate{align-items:center;padding-top:24px}}
.gate-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.gate-card h1{font-size:28px}
.gate-card p{margin:0}
.gate-card .input{font-size:22px;letter-spacing:.25em;text-align:center;min-height:52px}
.gate-card .btn{min-height:48px;font-size:16px}
.gate-msg{color:var(--altstadt);font-weight:600;font-size:14px;min-height:20px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Drankvoorraad</span></div>
    <div class="seg" id="locseg" role="group" aria-label="Locatie">
      <button type="button" data-loc="floats" aria-pressed="true">FLOATS</button>
      <button type="button" data-loc="altstadt" aria-pressed="false">ALTSTADT</button>
    </div>
  </div>
  <nav class="wrap tabs" aria-label="Onderdelen">
    <a href="#tellen">Tellen</a><a href="#overzicht">Overzicht</a><a href="#bestellen">Bestellen</a><a href="#producten">Producten</a>
  </nav>
</header>
<main class="wrap" id="view">
  <div class="empty"><h3>Voorraad laden…</h3><p>De productlijst en de tellingen van FLOATS en ALTSTADT worden opgehaald.</p></div>
</main>
<div id="modal" hidden></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
(function(){
'use strict';
var CATS=["Tapbier","Flesbier","Alcoholvrij bier & kombucha","Fris & mixers","Water","Sappen & zuivel","Wijn wit","Wijn rosé","Wijn rood","Bubbels & dessertwijn","Gedistilleerd","Likeuren & aperitief","Koffie & thee","Siropen & bar"];
var LOCS={floats:"FLOATS",altstadt:"ALTSTADT"};
var VIEWS=["tellen","overzicht","bestellen","producten"];
var COVER=1.5; // bestel-doel zonder minimum = 1,5 x gemiddeld weekverbruik
var WEEK_MS=604800000;

/* ---------- hulpfuncties ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem('dv.'+k);localStorage.setItem('dv.'+k,v)}catch(e){return null}}
function r2(n){return Math.round(n*100)/100}
var nf=new Intl.NumberFormat('nl-NL',{maximumFractionDigits:2});
function num(n){return n==null||isNaN(n)?'–':nf.format(r2(n))}
function eur(n){if(n==null||isNaN(n))return '–';return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',minimumFractionDigits:Math.abs(n)>=1000?0:2,maximumFractionDigits:Math.abs(n)>=1000?0:2}).format(n)}
function pct(n){return n==null||isNaN(n)?'–':new Intl.NumberFormat('nl-NL',{style:'percent',maximumFractionDigits:1}).format(n)}
function inStr(n){return n==null?'':String(r2(n)).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(',','.');if(s==='')return null;if(!/^\d*\.?\d*$/.test(s)||s==='.')return undefined;var n=parseFloat(s);return isNaN(n)?undefined:r2(n)}
function monUTC(d){var x=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x}
function weekIdOf(mon){var th=new Date(mon.getTime()+3*86400000);var y=th.getUTCFullYear();var w=Math.floor((th-Date.UTC(y,0,1))/WEEK_MS)+1;return y+'-W'+(w<10?'0':'')+w}
function weekMon(id){var m=/^(\d{4})-W(\d{2})$/.exec(id);var y=+m[1],w=+m[2];var mon1=monUTC(new Date(Date.UTC(y,0,4)));return new Date(mon1.getTime()+(w-1)*WEEK_MS)}
function shiftWeek(id,n){return weekIdOf(new Date(weekMon(id).getTime()+n*WEEK_MS))}
function weeksBetween(a,b){return Math.round((weekMon(b)-weekMon(a))/WEEK_MS)}
function weekNo(id){return +id.slice(6)}
var dfm=new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short',timeZone:'UTC'});
function weekRange(id){var m=weekMon(id);return dfm.format(m)+' – '+dfm.format(new Date(m.getTime()+6*86400000))}
function dateShort(iso){if(!iso)return '';try{return new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'short'}).format(new Date(iso))}catch(e){return ''}}
function todayWeek(){var n=new Date();return weekIdOf(monUTC(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))))}
function catIdx(c){var i=CATS.indexOf(c);return i<0?999:i}
function slug(s){return String(s).normalize('NFKD').replace(/[^\x00-\x7F]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}

/* ---------- toestand ---------- */
var hashView=(location.hash||'').slice(1);
var S={
  loc:LOCS[ls('loc')]?ls('loc'):'floats',
  view:VIEWS.indexOf(hashView)>=0?hashView:null,
  week:todayWeek(), mode:'tel', filter:'all', q:'', pq:'',
  catalog:{floats:null,altstadt:null}, counts:{}, got:{floats:false,altstadt:false,counts:false},
  overlay:{}, canWrite:true, isOwner:false, uid:null, names:{},
  db:null, user:null, dl:null, failed:null, slow:false, saveState:'', showAllUse:false, sig:''
};
var NOW_WEEK=S.week;

/* ---------- gegevens lezen ---------- */
function itemsOf(loc){var c=S.catalog[loc];return (c&&c.items)||{}}
function prodList(loc,all){
  var it=itemsOf(loc),out=[];
  Object.keys(it).forEach(function(id){var p=it[id];if(!p||typeof p!=='object')return;if(!all&&p.active===false)return;out.push({id:id,p:p})});
  out.sort(function(a,b){return catIdx(a.p.cat)-catIdx(b.p.cat)||String(a.p.cat).localeCompare(String(b.p.cat))||(a.p.ord||0)-(b.p.ord||0)||String(a.p.name).localeCompare(String(b.p.name))});
  return out;
}
function cid(loc,week){return loc+'_'+week}
function cnt(loc,week){
  var id=cid(loc,week),b=S.counts[id],o=S.overlay[id];
  if(!b&&!o)return null;

    .sort(function(a,b){return a.week<b.week?-1:a.week>b.week?1:0});

function prevDone(loc,week){var d=doneCounts(loc),p=null;for(var i=0;i<d.length;i++){if(d[i].week<week)p=d[i];else break}return p}
function priceOf(loc,c,id){if(c&&c.prices&&typeof c.prices[id]==='number')return c.prices[id];var p=itemsOf(loc)[id];return p&&typeof p.price==='number'?p.price:null}

/* per product: begin + geleverd - eind = verbruik */
function analyse(loc,c,prev){
  var it=itemsOf(loc),ids={},rows=[],gap=prev?Math.max(1,weeksBetween(prev.week,c.week)):null;

  [c.qty,c.inn,prev&&prev.qty].forEach(function(m){if(m)Object.keys(m).forEach(function(id){if(n0(m[id])>0&&it[id])ids[id]=1})});
  Object.keys(ids).forEach(function(id){

    var usage=(prev&&end!=null)?r2(begin+inn-end):null;

  rows.sort(function(a,b){return catIdx(a.p.cat)-catIdx(b.p.cat)||(a.p.ord||0)-(b.p.ord||0)});

  for(var i=from;i<d.length;i++){var a=analyse(loc,d[i],d[i-1]);weeks+=a.gap;a.rows.forEach(function(r){if(r.usage!=null)sum[r.id]=(sum[r.id]||0)+r.usage})}
  var out={};if(weeks>0)Object.keys(sum).forEach(function(id){out[id]=Math.max(0,sum[id]/weeks)});

function queue(docId,patch,now){
  var q=Q[docId]||(Q[docId]={patch:null,timer:null,busy:false,waiters:[]});
  q.patch=mergePatch(q.patch||{},patch);setSave('saving');
  clearTimeout(q.timer);
  return new Promise(function(res,rej){q.waiters.push({res:res,rej:rej});if(now)flush(docId);else q.timer=setTimeout(function(){flush(docId)},600)});
}
function ensureDoc(docId){
  if(S.counts[docId])return Promise.resolve();
  var ref=S.db.doc('counts/'+docId),parts=docId.split('_');
  return ref.get().then(function(s){if(s.exists)return;return ref.set({loc:parts[0],week:parts[1],status:'open',startedAt:new Date().toISOString(),qty:{},inn:{}})});
}
function flush(docId,retry){
  var q=Q[docId];if(!q||q.busy||!q.patch)return;
  var patch=q.patch,waiters=q.waiters;q.patch=null;q.waiters=[];q.busy=true;clearTimeout(q.timer);
  patch.updatedAt=new Date().toISOString();
  if(S.uid){patch.editors=patch.editors||{};patch.editors[S.uid]=true}
  ensureDoc(docId).then(function(){return S.db.doc('counts/'+docId).update(patch)}).then(function(){
    var o=S.overlay[docId];
    if(o)['qty','inn'].forEach(function(k){if(patch[k]&&o[k])Object.keys(patch[k]).forEach(function(id){if(o[k][id]===patch[k][id])delete o[k][id]})});
    q.busy=false;waiters.forEach(function(w){w.res()});
    if(q.patch)flush(docId);else if(!anyPending())setSave('saved');
  }).catch(function(e){
    q.busy=false;q.patch=mergePatch(patch,q.patch||{});q.waiters=waiters.concat(q.waiters);
    if(!retry&&(!e||e.code==='unavailable'||!e.code)){setTimeout(function(){flush(docId,true)},1200+Math.random()*800);return}
    var w=q.waiters;q.waiters=[];w.forEach(function(x){x.rej(e)});
    setSave('error');
    if(e&&e.code==='invalid_argument'){S.canWrite=false;toast('Opslaan is niet toegestaan. Meld dit bij de eigenaar.');render()}
    else toast(e&&e.code==='quota_exceeded'?'Opslag is vol. Meld dit bij de eigenaar.':'Opslaan lukt nu niet. Controleer je verbinding; je invoer blijft staan en wordt opnieuw geprobeerd.');
  });
}

/* ---------- wegen van een aangebroken fust ---------- */
function volOf(p){
  if(typeof p.vol==='number'&&p.vol>0)return p.vol;
  var m=/(\d+(?:[.,]\d+)?)\s*(l|cl|ml)\b/i.exec(p.unit||'');if(!m)return null;
  var n=parseFloat(m[1].replace(',','.')),u=m[2].toLowerCase();return u==='l'?n:u==='cl'?n/100:n/1000;
}
function weighable(p){return p.cat==='Tapbier'||typeof p.tare==='number'}
function unitWord(p){return String(p.unit||'stuk').split(' ')[0]||'stuk'}
function openWeigh(pid){
  var p=itemsOf(S.loc)[pid];if(!p)return;
  var c=cnt(S.loc,S.week)||{qty:{}},q=typeof c.qty[pid]==='number'?c.qty[pid]:null,b=S.counts[cid(S.loc,S.week)],w=b&&b.wt&&b.wt[pid],vol=volOf(p),word=esc(unitWord(p));
  function f(id,label,val,small){return '<div class="field"><label for="'+id+'">'+label+'</label><input class="input" id="'+id+'" inputmode="decimal" autocomplete="off" value="'+esc(val==null?'':val)+'">'+(small?'<small>'+small+'</small>':'')+'</div>'}
  openModal('<h2>'+esc(p.name)+' wegen</h2><p class="muted" style="margin:0">'+esc(p.unit)+' · weeg alleen wat is aangebroken.</p>'
    +'<div id="weighform" class="stack" data-pid="'+esc(pid)+'"><div class="grid2">'
    +f('w-n','Aantal vol',w&&typeof w.n==='number'?inStr(w.n):(q!=null?inStr(Math.floor(q)):''),'Nog dicht of niet aangesloten.')
    +f('w-kg','Gewicht aangebroken '+word+', in kg',w&&typeof w.kg==='number'?inStr(w.kg):'','Niets aangebroken? Laat leeg.')+'</div><div class="grid2">'
    +f('w-tare','Leeggewicht, in kg',typeof p.tare==='number'?inStr(p.tare):'','Weeg één keer een leeg exemplaar. Dit wordt onthouden.')
    +f('w-vol','Inhoud als vol, in liter',vol!=null?inStr(vol):'','Bier weegt ongeveer 1 kg per liter.')+'</div>'
    +'<div class="note" id="w-out"></div></div>'
    +'<div class="spread"><button class="btn ghost" data-close>Annuleren</button><button class="btn primary" id="w-ok">Overnemen in telling</button></div>');
  updWeigh();
}
function updWeigh(){
  var out=$('#w-out');if(!out)return null;
  var n=parseNum($('#w-n').value),kg=parseNum($('#w-kg').value),tare=parseNum($('#w-tare').value),vol=parseNum($('#w-vol').value);
  function say(cls,t){out.className='note'+(cls?' '+cls:'');out.textContent=t;return null}
  if(n===undefined||kg===undefined||tare===undefined||vol===undefined)return say('bad','Vul alleen getallen in, bv. 17,5.');
  if(n==null)n=0;
  if(kg==null){say('','Niets aangebroken: de telling wordt '+num(n)+'.');return {total:r2(n),n:n,kg:null,tare:tare,vol:vol}}
  if(tare==null)return say('warn','Vul het leeggewicht in om te kunnen rekenen.');
  if(!(vol>0))return say('warn','Vul in hoeveel liter erin gaat als hij vol is.');
  var net=kg-tare,frac=net/vol;
  if(net<-0.05)return say('bad','Het gewicht is lager dan het leeggewicht. Controleer beide getallen.');
  if(frac>1.08)return say('bad','Dit is zwaarder dan een vol exemplaar (ongeveer '+num(tare+vol)+' kg). Controleer het gewicht en het leeggewicht.');
  frac=Math.max(0,Math.min(1,frac));
  var total=r2(n+frac);

function niceMax(m){if(!(m>0))return 1;var p=Math.pow(10,Math.floor(Math.log10(m))),s=[1,2,2.5,5,10];for(var i=0;i<s.length;i++)if(s[i]*p>=m)return s[i]*p;return 10*p}

function barChart(data){

    s+='<rect x="'+(pl+slot*i)+'" y="'+pt+'" width="'+slot+'" height="'+ih+'" fill="transparent" data-tip="'+esc(d.tip)+'"/>';

/* ---------- BESTELLEN ---------- */
function orderLines(loc){
  var d=doneCounts(loc);if(!d.length)return null;
  var last=d[d.length-1],au=avgUsage(loc),bySup={};
  prodList(loc).forEach(function(x){
    var p=x.p,stock=n0(last.qty&&last.qty[x.id]),target=null,why='';
    if(typeof p.par==='number'){target=p.par;why='minimum '+num(p.par)}
    else if(au.avg[x.id]>0){target=Math.ceil(au.avg[x.id]*COVER);why='verbruik '+num(au.avg[x.id])+'/wk'}
    if(target==null||stock>=target)return;
    var pack=p.pack>1?p.pack:1,packs=Math.ceil((target-stock)/pack-1e-9),sup=p.sup||'Leverancier onbekend';
    (bySup[sup]=bySup[sup]||[]).push({p:p,stock:stock,target:target,why:why,packs:packs,units:packs*pack});
  });
  return {last:last,bySup:bySup,weeks:au.weeks};
}
function orderText(sup,lines){return sup+'\n'+lines.map(function(l){return '- '+l.packs+' × '+(l.p.packName||'stuk')+' '+l.p.name+' ('+(l.p.pack>1?l.p.pack+' × ':'')+l.p.unit+')'+(l.p.art?' art. '+l.p.art:'')}).join('\n')}
function renderBestellen(){
  var loc=S.loc,o=orderLines(loc),h='<section class="stack"><h2>Bestellijst '+esc(LOCS[loc])+'</h2>';
  if(!o){h+='<div class="card empty"><h3>Nog geen afgeronde telling</h3><p>De bestellijst wordt gemaakt uit de laatste afgeronde telling. Rond eerst een telling af.</p></div></section>';$('#view').innerHTML=h;return}
  var sups=Object.keys(o.bySup).sort();
  h+='<p class="muted" style="margin:0;max-width:65ch">Op basis van de telling van week '+weekNo(o.last.week)+'. Een product komt op de lijst als de voorraad onder het doel zit. Het doel is het minimum dat bij Producten is ingesteld; zonder minimum is het '+String(COVER).replace('.',',')+' × het gemiddelde weekverbruik'+(o.weeks?(o.weeks===1?' (laatste week)':' (laatste '+o.weeks+' weken)'):', zodra er twee tellingen zijn')+'.</p>';
  if(!sups.length)h+='<div class="card empty"><h3>Niets te bestellen</h3><p>'+(o.weeks?'Alle producten zitten op of boven hun doel.':'Er is nog maar één telling en er zijn geen minimumvoorraden ingesteld. Stel minimums in bij Producten, of wacht op de tweede telling.')+'</p></div>';
  sups.forEach(function(s,i){var L=o.bySup[s];
    h+='<div class="card stack"><div class="spread"><h3>'+esc(s)+' <span class="muted" style="font-weight:500">· '+L.length+' regel'+(L.length>1?'s':'')+'</span></h3><button class="btn" data-copytext="'+esc(orderText(s,L))+'">Kopieer voor bestelling</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th class="r">Bestellen</th></tr></thead><tbody>'
      +L.map(function(l){return '<tr><td>'+esc(l.p.name)+'<div class="muted" style="font-size:12.5px">'+esc(l.p.unit)+(l.p.art?' · art. '+esc(l.p.art):'')+'</div><div class="muted num" style="font-size:12.5px">voorraad '+num(l.stock)+' · doel '+num(l.target)+' ('+esc(l.why)+')</div></td><td class="r"><b>'+l.packs+' × '+esc(l.p.packName||'stuk')+'</b>'+(l.p.pack>1?'<div class="muted" style="font-size:12.5px">= '+num(l.units)+' stuks</div>':'')+'</td></tr>'}).join('')
      +'</tbody></table></div></div>'});
  $('#view').innerHTML=h+'</section>';
}

/* ---------- PRODUCTEN ---------- */
function renderProducten(){
  var loc=S.loc,all=prodList(loc,true),act=all.filter(function(x){return x.p.active!==false}).length;
  var h='<section class="stack"><div class="spread"><div><h2>Producten '+esc(LOCS[loc])+'</h2><span class="muted">'+act+' actief'+(all.length>act?' · '+(all.length-act)+' niet actief':'')+'</span></div>'+(S.canWrite?'<button class="btn primary" id="addprod">Product toevoegen</button>':'')+'</div>'
    +'<input class="input" id="pq" type="search" placeholder="Zoek product of leverancier" value="'+esc(S.pq)+'" aria-label="Zoek product"><div id="plist"></div></section>';
  $('#view').innerHTML=h;renderProdList();
}
function renderProdList(){
  var el=$('#plist');if(!el)return;
  var q=S.pq.trim().toLowerCase(),all=prodList(S.loc,true).filter(function(x){return !q||(x.p.name+' '+x.p.cat+' '+(x.p.sup||'')).toLowerCase().indexOf(q)>=0});
  if(!all.length){el.innerHTML='<div class="empty"><h3>'+(q?'Geen producten gevonden':'Nog geen producten')+'</h3><p>'+(q?'Pas je zoekterm aan.':'Voeg het eerste product toe met de knop hierboven.')+'</p></div>';return}
  var h='',cur=null;
  all.forEach(function(x){var p=x.p;
    if(p.cat!==cur){if(cur!==null)h+='</div>';cur=p.cat;h+='<div class="cat-head"><h3>'+esc(cur)+'</h3></div><div class="rows">'}
    h+='<button type="button" class="prow'+(p.active===false?' off':'')+'" data-edit="'+esc(x.id)+'"'+(S.canWrite?'':' disabled')+'><span class="row-main"><span class="row-name" style="display:block">'+esc(p.name)+(p.active===false?' <span class="pill">niet actief</span>':'')+'</span><span class="row-sub">'+esc(p.unit)+' · '+(typeof p.price==='number'?eur(p.price)+(p.est?' (schatting)':''):'<span class="pill warn">prijs ontbreekt</span>')+(typeof p.par==='number'?' · minimum '+num(p.par):'')+(typeof p.tare==='number'?' · leeg '+num(p.tare)+' kg':'')+(p.pack>1?' · '+esc(p.packName||'verpakking')+' van '+p.pack:'')+(p.sup?' · '+esc(p.sup):'')+'</span></span><span class="chev" aria-hidden="true">›</span></button>'});
  el.innerHTML=h+'</div>';
}
function openProduct(pid){
  var loc=S.loc,p=pid?itemsOf(loc)[pid]:{cat:CATS[0],pack:1,active:true},cats=CATS.slice();
  prodList(loc,true).forEach(function(x){if(cats.indexOf(x.p.cat)<0)cats.push(x.p.cat)});
  function f(id,label,val,extra,small){return '<div class="field"><label for="'+id+'">'+label+'</label><input class="input" id="'+id+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'>'+(small?'<small>'+small+'</small>':'')+'</div>'}
  var h='<h2>'+(pid?'Product bewerken':'Product toevoegen')+'</h2><p class="muted" style="margin:0">'+esc(LOCS[loc])+'</p>'
    +f('p-name','Naam',p.name,'autocomplete="off"')
    +'<div class="grid2"><div class="field"><label for="p-cat">Categorie</label><select class="input" id="p-cat">'+cats.map(function(c){return '<option'+(c===p.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>'
    +f('p-unit','Tel-eenheid',p.unit,'placeholder="bv. flesje 20 cl, fles 70 cl, fust 20 L"','Wat je telt als 1.')+'</div>'
    +'<div class="grid2">'+f('p-price','Inkoopprijs per tel-eenheid, excl. btw',typeof p.price==='number'?inStr(p.price):'','inputmode="decimal" placeholder="bv. 0,54"','Kratprijs ÷ aantal flesjes.')
    +f('p-par','Minimumvoorraad',typeof p.par==='number'?inStr(p.par):'','inputmode="decimal" placeholder="leeg = op basis van verbruik"','Onder dit aantal komt het op de bestellijst.')+'</div>'
    +'<div class="grid2">'+f('p-pack','Aantal per bestel-eenheid',p.pack||1,'inputmode="numeric"','bv. 24 flesjes per krat.')+f('p-packname','Naam bestel-eenheid',p.packName,'placeholder="krat, doos, fust, fles"')+'</div>'
    +'<div class="grid2">'+f('p-sup','Leverancier',p.sup,'placeholder="bv. Sligro"')+f('p-art','Artikelnummer (optioneel)',p.art)+'</div>'
    +'<div class="grid2">'+f('p-tare','Leeggewicht in kg (optioneel)',typeof p.tare==='number'?inStr(p.tare):'','inputmode="decimal" placeholder="bv. gewicht van een leeg fust"','Vul dit in om het product te kunnen wegen bij het tellen.')+f('p-vol','Inhoud in liter (optioneel)',typeof p.vol==='number'?inStr(p.vol):'','inputmode="decimal" placeholder="'+(pid&&volOf(p)!=null?inStr(volOf(p)):'bv. 20')+'"','Leeg = afgeleid uit de tel-eenheid.')+'</div>'
    +'<label class="rowflex"><input type="checkbox" id="p-active"'+(p.active===false?'':' checked')+' style="width:20px;height:20px"> <span>Actief: staat op de tellijst</span></label>'
    +'<div class="note bad" id="p-err" hidden></div>'
    +'<div class="spread"><button class="btn ghost" data-close>Annuleren</button><button class="btn primary" id="p-save" data-pid="'+esc(pid||'')+'">Opslaan</button></div>';
  openModal(h);
}
function doSaveProduct(){
  var loc=S.loc,pid=$('#p-save').dataset.pid,old=pid?itemsOf(loc)[pid]:null,err=$('#p-err');
  function bad(m){err.textContent=m;err.hidden=false}
  var name=$('#p-name').value.trim(),unit=$('#p-unit').value.trim(),price=parseNum($('#p-price').value.replace('€','')),par=parseNum($('#p-par').value),pack=parseNum($('#p-pack').value),tare=parseNum($('#p-tare').value),vol=parseNum($('#p-vol').value);
  if(tare===undefined||vol===undefined)return bad('Leeggewicht en inhoud moeten getallen zijn, bv. 7,5 en 20.');
  if(!name)return bad('Vul een naam in.');
  if(!unit)return bad('Vul de tel-eenheid in, bv. flesje 20 cl.');
  if(price===undefined)return bad('De inkoopprijs is geen geldig bedrag. Gebruik bv. 0,54.');
  if(par===undefined)return bad('De minimumvoorraad is geen geldig getal.');
  if(pack===undefined||pack===null||pack<1)pack=1;
  var p={name:name.slice(0,80),cat:$('#p-cat').value,unit:unit.slice(0,40),price:price,par:par,pack:Math.round(pack),packName:$('#p-packname').value.trim().slice(0,20)||(pack>1?'verpakking':'stuk'),
    tare:tare,vol:vol,sup:$('#p-sup').value.trim().slice(0,40),art:$('#p-art').value.trim().slice(0,30),active:$('#p-active').checked,
    ord:old&&typeof old.ord==='number'?old.ord:Date.now()%1e9,est:old&&old.est&&old.price===price?true:false};
  if(!pid)pid=loc.charAt(0)+'-'+(slug(name+' '+unit)||'product').slice(0,60)+'-'+Math.random().toString(36).slice(2,6);
  var b=$('#p-save');b.disabled=true;b.textContent='Opslaan…';
  saveProduct(loc,pid,p).then(function(){closeModal();toast('Product opgeslagen.')}).catch(function(e){b.disabled=false;b.textContent='Opslaan';bad(e&&e.code==='invalid_argument'?'Producten wijzigen is op dit moment niet toegestaan.':'Opslaan is niet gelukt. Controleer je verbinding en probeer het opnieuw.')});
}

/* ---------- gebeurtenissen ---------- */
function copyText(txt,btn){
  function ok(){toast('Gekopieerd.')}
  function fb(){openModal('<h2>Kopiëren</h2><p class="muted" style="margin:0">Selecteer de tekst en kopieer hem.</p><textarea class="input" readonly>'+esc(txt)+'</textarea><div class="spread"><span></span><button class="btn" data-close>Sluiten</button></div>');var t=$('#modal textarea');t.focus();t.select()}
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
}
document.addEventListener('click',function(e){
  var t=e.target,b;
  if((b=t.closest('a[href^="#"]'))){var hv=b.getAttribute('href').slice(1);if(VIEWS.indexOf(hv)>=0){e.preventDefault();if(hv!==S.view){S.view=hv;render();window.scrollTo(0,0)}try{if(location.hash!=='#'+hv)location.hash=hv}catch(x){}return}}
  if((b=t.closest('#locseg button,.loccard'))){S.loc=b.dataset.loc;ls('loc',S.loc);S.q='';S.pq='';S.filter='all';render();return}
  if(t.closest('[data-close]')||t.id==='modal'){closeModal();return}
  if((b=t.closest('[data-copy]'))){var ta=$(b.dataset.copy);copyText(ta.value);return}
  if((b=t.closest('[data-copytext]'))){copyText(b.getAttribute('data-copytext'));return}
  if(t.closest('#wkprev')){S.week=shiftWeek(S.week,-1);S.filter='all';render();return}
  if(t.closest('#wknext')){if(S.week<NOW_WEEK){S.week=shiftWeek(S.week,1);S.filter='all';render()}return}
  if((b=t.closest('#modeseg button'))){S.mode=b.dataset.mode;S.filter='all';render();return}
  if((b=t.closest('[data-filter]'))){S.filter=b.dataset.filter;render();return}
  if((b=t.closest('[data-jump]'))){var s=$('#cat-'+b.dataset.jump);if(s)s.scrollIntoView({block:'start'});else{S.q='';S.filter='all';render();s=$('#cat-'+b.dataset.jump);if(s)s.scrollIntoView({block:'start'})}return}
  if((b=t.closest('.st'))){var inp=$('.qty',b.closest('.row')),v=parseNum(inp.value);if(v===undefined||v===null)v=b.dataset.step>0?0:1;v=Math.max(0,r2(v+(+b.dataset.step)));inp.value=inStr(v);inp.classList.remove('invalid');onQtyInput(inp);return}
  if((b=t.closest('[data-weigh]'))){openWeigh(b.closest('.row').dataset.pid);return}
  if(t.closest('#w-ok')){doWeigh();return}
  if(t.closest('#finish')){openFinish();return}
  if(t.closest('#f-ok')){doFinish();return}
  if(t.closest('#reopen')){queue(cid(S.loc,S.week),{status:'open'},true).then(function(){toast('Telling heropend. Vergeet niet opnieuw af te ronden.')}).catch(function(){});return}
  if(t.closest('#alluse')){S.showAllUse=!S.showAllUse;render();return}
  if(t.closest('#csv')){exportCsv();return}
  if(t.closest('#addprod')){openProduct(null);return}
  if((b=t.closest('[data-edit]'))){openProduct(b.dataset.edit);return}
  if(t.closest('#p-save')){doSaveProduct();return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.classList.contains('qty')){onQtyInput(t);return}
  if(t.closest('#weighform')){updWeigh();return}
  if(t.id==='q'){S.q=t.value;var l=$('#list');if(l){var c=cnt(S.loc,S.week),done=c&&c.status==='done';l.innerHTML=listHtml(tellenRows(),c,prevDone(S.loc,S.week),!S.canWrite||done,prodList(S.loc));updProgress()}return}
  if(t.id==='pq'){S.pq=t.value;renderProdList();return}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('qty')){e.preventDefault();var all=$all('#list .qty'),i=all.indexOf(e.target);if(all[i+1]){all[i+1].focus();all[i+1].select()}else e.target.blur()}
});
document.addEventListener('focusin',function(e){if(e.target.classList&&e.target.classList.contains('qty'))setTimeout(function(){try{e.target.select()}catch(x){}},0)});
document.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('help'))ls('help',e.target.open?'1':'0')},true);
document.addEventListener('pointermove',function(e){var t=e.target.closest?e.target.closest('[data-tip]'):null,tip=$('#tip');if(!t){tip.hidden=true;return}tip.textContent=t.getAttribute('data-tip');tip.hidden=false;var w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(window.innerWidth-w-8,e.clientX-w/2))+'px';tip.style.top=Math.max(8,e.clientY-38)+'px'});
document.addEventListener('pointerleave',function(){$('#tip').hidden=true},true);
window.addEventListener('hashchange',function(){var v=(location.hash||'').slice(1);if(VIEWS.indexOf(v)>=0&&v!==S.view){S.view=v;render();window.scrollTo(0,0)}});
window.addEventListener('online',function(){Object.keys(Q).forEach(function(k){flush(k)})});
window.addEventListener('beforeunload',function(){Object.keys(Q).forEach(function(k){flush(k)})});
document.addEventListener('visibilitychange',function(){if(document.hidden)Object.keys(Q).forEach(function(k){flush(k)})});

/* ---------- start ---------- */
function fail(t,m){S.failed={t:t,m:m};render()}
function start(){
  if(!S.view)S.view='tellen';
  render();
  if(!window.claude||!window.claude.use){fail('De website is niet goed geladen','Laad de pagina opnieuw. Blijft dit terugkomen, meld het bij de eigenaar.');return}
  var slowT=setTimeout(function(){if(!ready()){S.slow=true;render()}},10000);
  Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]).then(function(r){
    S.db=r[0];S.user=r[1];S.dl=r[2];
    if(!S.db){clearTimeout(slowT);fail('De website is nog niet gekoppeld aan de database','De koppeling met de database ontbreekt. Meld dit bij de eigenaar.');return}
    if(S.user){
      S.user.me().then(function(me){S.uid=me.id||(ls('naam')?'naam:'+ls('naam'):null);if(S.uid&&!me.id)S.names[S.uid]=ls('naam');S.isOwner=!!me.isOwner;if(me.id&&me.name)S.names[me.id]=me.name;
        if(!hashView&&S.isOwner&&S.view==='tellen'&&ready()&&doneCounts('floats').length+doneCounts('altstadt').length>0){S.view='overzicht';render()}});
      S.user.can('data.write').then(function(c){if(c===false){S.canWrite=false;render()}});
    }
    function onErr(e){clearTimeout(slowT);fail('De voorraad is niet meer bereikbaar','Laad de pagina opnieuw. Blijft dit terugkomen, meld het bij de eigenaar.')}
    Object.keys(LOCS).forEach(function(loc){
      S.db.doc('catalog/'+loc).onSnapshot(function(s){
        var d=s.exists?s.data():null;S.catalog[loc]={items:(d&&d.items)||{},_exists:!!s.exists};S.got[loc]=true;if(ready())clearTimeout(slowT);render(true);
      },onErr);
    });
    S.db.collection('counts').limit(1000).onSnapshot(function(qs){
      var m={};qs.docs.forEach(function(d){var x=d.data();if(x&&x.loc&&x.week)m[d.id]=x});
      S.counts=m;S.got.counts=true;if(ready())clearTimeout(slowT);
      if(!hashView&&S.isOwner&&S.view==='tellen'&&!S.autoView&&ready()&&doneCounts('floats').length+doneCounts('altstadt').length>0){S.autoView=true;S.view='overzicht'}
      S.autoView=true;render(true);
    },onErr);
  });
}
start();
})();
</script>
</body>
</html>
